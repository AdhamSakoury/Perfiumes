<button type="button" class="admin-sidebar-toggle" (click)="open.set(!open())" aria-label="Open admin sidebar">
  <i class="fas" [class.fa-bars]="!open()" [class.fa-times]="open()"></i>
</button>

<button type="button" class="admin-sidebar-backdrop" [class.show]="open()" (click)="close()" aria-label="Close admin sidebar"></button>

<aside class="admin-global-sidebar" [class.open]="open()">
  <div class="admin-sidebar-head">
    <span class="admin-avatar">{{ (auth.currentUser()?.fullName || 'A').slice(0, 1).toUpperCase() }}</span>
    <div>
      <strong>{{ auth.currentUser()?.fullName || 'Admin' }}</strong>
      <small>{{ auth.currentUser()?.email }}</small>
    </div>
  </div>

  <nav class="admin-side-nav">
    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="close()">
      <i class="fas fa-gauge-high"></i><span>Dashboard</span>
    </a>
    <a routerLink="/admin/products" routerLinkActive="active" (click)="close()">
      <i class="fas fa-boxes-stacked"></i><span>Products</span>
    </a>
    <a routerLink="/admin/orders" routerLinkActive="active" (click)="close()">
      <i class="fas fa-clipboard-list"></i><span>Orders</span>
    </a>
    <a routerLink="/admin/messages" routerLinkActive="active" (click)="close()">
      <i class="fas fa-headset"></i><span>Support Inbox</span>
    </a>
    <a routerLink="/account" routerLinkActive="active" (click)="close()">
      <i class="fas fa-user"></i><span>Account</span>
    </a>
  </nav>
</aside>
