<section class="page-shell page-enter flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md bg-white dark:bg-nubian-surface rounded-2xl shadow-2xl p-6 border border-nubian-gold/20 text-center">
    <i class="fab fa-google text-2xl text-nubian-terracotta mb-4"></i>
    <h1 class="text-2xl font-bold text-nubian-brown dark:text-nubian-gold font-cinzel">{{ 'googleCallback' | t }}</h1>
    @if (loading) {
      <p class="text-nubian-earth dark:text-nubian-sand mt-3 mb-6">{{ 'googleCallbackSigningIn' | t }}</p>
      <i class="fas fa-spinner fa-spin text-nubian-gold"></i>
    } @else if (error) {
      <p class="text-nubian-earth dark:text-nubian-sand mt-3 mb-6">{{ error }}</p>
      <a routerLink="/login" class="inline-flex px-6 py-3 bg-nubian-brown text-white rounded-lg">{{ 'backToLogin' | t }}</a>
    }
  </div>
</section>
