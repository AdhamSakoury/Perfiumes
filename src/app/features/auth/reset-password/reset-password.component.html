<section class="page-shell page-enter flex items-center justify-center px-4 py-16">
  <form (ngSubmit)="submit()" class="w-full max-w-md bg-white dark:bg-nubian-surface rounded-2xl shadow-2xl p-6 border border-nubian-gold/20 space-y-5">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-nubian-brown dark:text-nubian-gold font-cinzel">{{ 'resetPassword' | t }}</h1>
      <p class="text-nubian-earth dark:text-nubian-sand mt-2">{{ 'resetSubtitle' | t }}</p>
    </div>
    <input type="password" name="password" [(ngModel)]="password" [placeholder]="'newPassword' | t" class="w-full px-4 py-3 rounded-lg border border-nubian-sand dark:border-nubian-gold/25 bg-white dark:bg-nubian-surface2" required>
    <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" [placeholder]="'confirmPassword' | t" class="w-full px-4 py-3 rounded-lg border border-nubian-sand dark:border-nubian-gold/25 bg-white dark:bg-nubian-surface2" required>
    @if (error) { <p class="text-nubian-terracotta text-sm">{{ error }}</p> }
    <button type="submit" [disabled]="loading || !token" class="w-full py-3 bg-nubian-brown text-white font-bold rounded-lg hover:bg-nubian-gold hover:text-nubian-dark transition-all disabled:opacity-60">
      {{ loading ? ('processing' | t) : ('resetPassword' | t) }}
    </button>
    <a routerLink="/login" class="block text-center text-nubian-gold font-semibold">{{ 'backToLogin' | t }}</a>
  </form>
</section>
