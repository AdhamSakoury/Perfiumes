<button type="button" (click)="startGoogleSignIn()" class="google-custom-button">
  <span class="google-mark">
    <i class="fab fa-google"></i>
  </span>
  <span>{{ configured ? (buttonLabelKey() | t) : ('addGoogleClientId' | t) }}</span>
  <i class="fas fa-arrow-right google-arrow"></i>
</button>
