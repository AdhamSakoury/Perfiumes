<section class="page-shell page-enter w-full px-4 sm:px-6 lg:px-10 xl:px-16 2xl:px-20 py-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-nubian-brown dark:text-nubian-gold font-cinzel">Wishlist</h1>
        <span class="px-4 py-2 rounded-full bg-nubian-gold text-nubian-dark font-bold">{{ wishlist.count() }} item{{ wishlist.count() === 1 ? '' : 's' }}</span>
      </div>

      @if (!auth.currentUser()) {
        <div class="text-center py-14 md:py-16 bg-white dark:bg-nubian-surface rounded-2xl shadow-lg">
          <i class="fas fa-lock text-2xl text-nubian-gold/60 mb-4"></i>
          <h2 class="text-2xl font-bold font-cinzel mb-3">Login required</h2>
          <a routerLink="/login" class="inline-flex px-6 py-3 bg-nubian-brown text-white rounded-lg">Login</a>
        </div>
      } @else if (!wishlist.perfumes().length) {
        <div class="text-center py-14 md:py-16 bg-white dark:bg-nubian-surface rounded-2xl shadow-lg">
          <i class="fas fa-heart text-2xl text-nubian-gold/60 mb-4"></i>
          <h2 class="text-2xl font-bold font-cinzel mb-3">No saved perfumes yet</h2>
          <a routerLink="/perfumes" class="inline-flex px-6 py-3 bg-nubian-brown text-white rounded-lg">Explore Perfumes</a>
        </div>
      } @else {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 min-[1800px]:grid-cols-6 gap-5">
          @for (perfume of wishlist.perfumes(); track perfume.id) {
            <app-perfume-card [perfume]="perfume" />
          }
        </div>
      }
    </section>
