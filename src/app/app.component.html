<div class="bg-nubian-cream dark:bg-nubian-dark text-nubian-dark dark:text-nubian-sand transition-colors duration-300 nubian-pattern min-h-screen flex flex-col" [class.admin-sidebar-mode]="showAdminSidebar()">
      <app-navbar />
      @if (showAdminSidebar()) {
        <app-admin-sidebar />
      }
      <main class="flex-1">
        <router-outlet />
      </main>
      @if (!showAdminSidebar()) {
        <app-footer />
        <app-chatbot-widget />
      }

      @if (toast.toast(); as activeToast) {
        <div class="toast active" [class.error]="activeToast.type === 'error'" [class.success]="activeToast.type === 'success'">
          <i class="fas" [class.fa-check-circle]="activeToast.type === 'success'" [class.fa-exclamation-circle]="activeToast.type === 'error'"></i>
          <span>{{ activeToast.message }}</span>
        </div>
      }
    </div>
