<div class="audio-player" [class.is-playing]="playing">
  <audio #audio [src]="src" preload="metadata"
    (loadedmetadata)="onLoadedMetadata(audio)"
    (timeupdate)="onTimeUpdate(audio)"
    (play)="playing = true"
    (pause)="playing = false"
    (ended)="onEnded(audio)"></audio>

  <!-- Play / Pause Button -->
  <button type="button" class="audio-btn" (click)="togglePlayback(audio)"
    [attr.aria-label]="playing ? 'إيقاف مؤقت' : 'تشغيل'">
    <i class="fas" [class.fa-pause]="playing" [class.fa-play]="!playing"></i>
  </button>

  <!-- Waveform & Meta -->
  <div class="audio-content">
    <!-- Interactive Waveform Bars -->
    <div
      class="audio-waveform"
      role="slider"
      [attr.aria-valuenow]="currentTime"
      [attr.aria-valuemax]="duration"
      (mousedown)="startSeeking(audio, $event)"
      (mousemove)="onSeeking(audio, $event)"
      (mouseup)="stopSeeking()"
      (mouseleave)="stopSeeking()"
      (touchstart)="startTouchSeeking(audio, $event)"
      (touchmove)="onTouchSeeking(audio, $event)"
      (touchend)="stopSeeking()"
      title="انقر أو اسحب للتقديم والتأخير">
      @for (bar of bars; track $index) {
        <span
          class="waveform-bar"
          [class.played]="isBarPlayed($index)"
          [class.current]="isCurrentBar($index)"
          [style.height.%]="bar"></span>
      }
    </div>

    <!-- Duration / Elapsed & Speed -->
    <div class="audio-info">
      <span class="audio-time">
        {{ formatTime(currentTime) }}
        <span class="audio-sep">/</span>
        {{ formatTime(duration) }}
      </span>

      <button type="button" class="audio-speed-btn" (click)="toggleSpeed(audio)" title="سرعة التشغيل">
        {{ playbackRate }}x
      </button>
    </div>
  </div>
</div>
