<div class="custom-dropdown" [class.is-open]="open" [class.is-open-upward]="openUpward" [class.is-disabled]="disabled" [class.is-compact]="compact">
  <button
    type="button"
    class="custom-dropdown-trigger"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    (click)="toggle()">
    <span class="custom-dropdown-value">
      @if (selectedOption?.icon) {
        <i class="fas {{ selectedOption!.icon }}"></i>
      }
      <span>{{ selectedOption?.label || placeholder }}</span>
    </span>
    <i class="fas fa-chevron-down custom-dropdown-chevron"></i>
  </button>

  @if (open) {
    <div class="custom-dropdown-menu" role="listbox">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="custom-dropdown-option"
          role="option"
          [disabled]="option.disabled"
          [class.is-active]="option.value === value"
          [attr.aria-selected]="option.value === value"
          (click)="select(option.value)">
          @if (option.icon) {
            <span class="custom-dropdown-option-icon"><i class="fas {{ option.icon }}"></i></span>
          }
          <span class="custom-dropdown-option-copy">
            <strong>{{ option.label }}</strong>
            @if (option.description) {
              <small>{{ option.description }}</small>
            }
          </span>
          @if (option.value === value) {
            <i class="fas fa-check custom-dropdown-check"></i>
          }
        </button>
      }
    </div>
  }
</div>
