name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "backend/Perfiumes.Api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: dotnet publish backend/Perfiumes.Api/Perfiumes.Api.csproj --configuration Release --output ./publish

      - name: Deploy to MonsterASP over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./publish/
          server-dir: ${{ secrets.MONSTERASP_FTP_SERVER_DIR }}
          exclude: |
            **/web.config
            **/appsettings*.json
            **/App_Data/**
            **/uploads/**
            **/logs/**
